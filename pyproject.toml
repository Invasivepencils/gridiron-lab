[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron-lab"
version = "0.1.0"
description = "Reproducible NFL forecasting and injury-scenario research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["nflreadpy>=0.1,<1"]

[project.scripts]
gridiron-lab = "gridiron_lab.cli:main"

[tool.setuptools.packages.find]
include = ["gridiron_lab*"]
